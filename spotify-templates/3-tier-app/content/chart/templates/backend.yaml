apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    backstage.io/kubernetes-id: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
        backstage.io/kubernetes-id: {{ .Release.Name }}
    spec:
      # Wait for the database instead of crashing into a growing restart backoff.
      initContainers:
        - name: wait-for-db
          image: busybox:1.37-musl
          command: ["timeout", "600", "sh", "-c", "until nc -z {{ .Release.Name }}-db-rw 5432; do echo waiting for {{ .Release.Name }}-db-rw:5432; sleep 5; done"]
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          command: ["node", "/app/index.js"]
          workingDir: /app
          env:
            - name: DB_HOST
              value: {{ .Release.Name }}-db-rw
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-app
                  key: password
          ports:
            - containerPort: {{ .Values.backend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    backstage.io/kubernetes-id: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: 80
      targetPort: {{ .Values.backend.port }}
