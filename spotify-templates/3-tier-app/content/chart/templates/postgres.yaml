apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-db
  labels:
    backstage.io/kubernetes-id: {{ .Release.Name }}
spec:
  # CloudNativePG copies these onto the instance pods and services
  inheritedMetadata:
    labels:
      backstage.io/kubernetes-id: {{ .Release.Name }}
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storageSize }}
