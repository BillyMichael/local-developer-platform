# CloudNativePG via the platform's storage.ldp composition. Credentials: Secret
# {{ .Release.Name }}-db-app; primary: {{ .Release.Name }}-db-rw.
apiVersion: storage.ldp/v1alpha1
kind: PostgresDatabase
metadata:
  name: {{ .Release.Name }}-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: {{ .Values.postgres.instances }}
  storageSize: {{ .Values.postgres.storageSize }}
  labels:
    backstage.io/kubernetes-id: {{ .Release.Name }}
