[project]
name = "${{ values.name }}"
version = "0.1.0"
description = ${{ values.description | dump }}
requires-python = ">=3.11"
dependencies = [
    # Pinned to the kagent controller in platform-apps/devtools/kagent: the
    # checkpointer and task store talk to that controller's REST API, so bump together.
    "kagent-langgraph==0.10.1",
    "kagent-core==0.10.1",
    # kagent-langgraph imports a2a.server.apps, which a2a-sdk 1.x removed
    "a2a-sdk>=0.3.26,<1.0",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-anthropic>=0.3.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115",
    "aio-pika>=9.4",
    # kagent.core's tracing module imports the OpenAI instrumentor, which imports openai,
    # but kagent-core does not declare it
    "openai>=1.0",
]

# The Dockerfile runs `agent`, so keep this script name
[project.scripts]
agent = "${{ values.pkgName }}.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["${{ values.pkgName }}*"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
