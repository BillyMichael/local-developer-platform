app:
  title: Backstage | Local Developer Portal
  extensions:
    # Only where a README exists, in the side rail.
    - entity-card:readme:
        config:
          hideIfNotFound: true
          type: info
    # Relationship cards only where declared, not an empty card on every entity.
    - entity-card:catalog/depends-on-components:
        config:
          filter: { spec.dependsOn: { $exists: true } }
    - entity-card:catalog/depends-on-resources:
        config:
          filter: { spec.dependsOn: { $exists: true } }
    - entity-card:api-docs/provided-apis:
        config:
          filter: { spec.providesApis: { $exists: true } }
    - entity-card:api-docs/consumed-apis:
        config:
          filter: { spec.consumesApis: { $exists: true } }
    # Subcomponents declare the relation on the child, so there's nothing to filter on.
    - entity-card:catalog/has-subcomponents: false
    # Upstream shows these on every entity; scope them to entities that use them.
    - entity-content:techdocs:
        config:
          filter:
            metadata.annotations.backstage.io/techdocs-ref: { $exists: true }
    - entity-card:argocd/overviewCard:
        config:
          filter:
            metadata.annotations.argocd/app-name: { $exists: true }
    - entity-card:argocd/historyCard:
        config:
          filter:
            metadata.annotations.argocd/app-name: { $exists: true }
    - entity-content:argocd/ArgoCdPage:
        config:
          filter:
            metadata.annotations.argocd/app-name: { $exists: true }
    - entity-card:catalog-graph/relations:
        config:
          height: 320

organization:
  name: Local Developer Portal

# Without this the permission backend allows everything and permissionPolicy.ts never runs.
permission:
  enabled: true

backend:
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  cache:
    store: memory