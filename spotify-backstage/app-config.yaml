app:
  title: Backstage | Local Developer Portal
  # Scopes the plugins' own extensions (new frontend system). Features are
  # listed in packages/app/src/App.tsx.
  extensions:
    # Only on entities with a README beside catalog-info.yaml, and in the
    # overview's side rail rather than above everything else.
    - entity-card:readme:
        config:
          hideIfNotFound: true
          type: info
    # Relationship cards only where the entity declares the relationship,
    # instead of an empty-state card on every leaf component.
    - entity-card:catalog/depends-on-components:
        config:
          filter: { spec.dependsOn: { $exists: true } }
    - entity-card:catalog/depends-on-resources:
        config:
          filter: { spec.dependsOn: { $exists: true } }
    - entity-card:api-docs/provided-apis:
        config:
          filter: { spec.providesApis: { $exists: true } }
    - entity-card:api-docs/consumed-apis:
        config:
          filter: { spec.consumesApis: { $exists: true } }
    # Subcomponents declare the relation on themselves, so the parent has
    # nothing to filter on; nothing in LDP uses them.
    - entity-card:catalog/has-subcomponents: false
    # Upstream ships the entity Docs tab unfiltered; only show it where
    # the entity actually publishes TechDocs.
    - entity-content:techdocs:
        config:
          filter:
            metadata.annotations.backstage.io/techdocs-ref: { $exists: true }
    # Roadie ships the Argo CD cards on every component and its tab on every
    # entity; show them only where an Argo CD Application is declared.
    - entity-card:argocd/overviewCard:
        config:
          filter:
            metadata.annotations.argocd/app-name: { $exists: true }
    - entity-card:argocd/historyCard:
        config:
          filter:
            metadata.annotations.argocd/app-name: { $exists: true }
    - entity-content:argocd/ArgoCdPage:
        config:
          filter:
            metadata.annotations.argocd/app-name: { $exists: true }
    - entity-card:catalog-graph/relations:
        config:
          height: 320

organization:
  name: Local Developer Portal

# Enforces packages/backend/src/permissionPolicy.ts; without this the
# permission backend allows everything and the policy never runs.
permission:
  enabled: true

backend:
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  cache:
    store: memory