apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: ca
spec:
  sources:
  - secret:
      name: "root-ca"
      key: "tls.crt"
  # Public roots too: consumers point SSL_CERT_FILE at this bundle (Gitea, Actions jobs),
  # which replaces the system store, so without them nothing can reach the internet
  - useDefaultCAs: true
  # A corporate TLS-inspection CA, when cluster-up.sh found one on the host. A
  # selector (not a name) so the bundle still reconciles when there is none.
  - configMap:
      selector:
        matchLabels:
          trust.ldp.dev/extra-ca: "true"
      key: "ca.crt"
  target:
    configMap:
      key: "trust-bundle.pem"
