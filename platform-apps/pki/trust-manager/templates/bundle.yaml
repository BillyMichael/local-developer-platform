apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: ca
spec:
  sources:
  - secret:
      name: "root-ca"
      key: "tls.crt"
  # SSL_CERT_FILE consumers use this bundle instead of the system store
  - useDefaultCAs: true
  # host proxy CA from cluster-up.sh; a selector so the bundle reconciles when there is none
  - configMap:
      selector:
        matchLabels:
          trust.ldp.dev/extra-ca: "true"
      key: "ca.crt"
  target:
    configMap:
      key: "trust-bundle.pem"
