ldp:
  syncWave: wave-6

victoria-logs-single:
  server:
    retentionPeriod: 7d
    persistentVolume:
      size: 2Gi
    # first start ingests every existing log at once; 256Mi was OOM-killed
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    # ponytail: no auth in front of the logs UI (loopback only, one team).
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: ca-issuer
      hosts:
        - name: logs-127-0-0-1.nip.io
          path:
            - /
          port: http
      tls:
        - hosts:
            - logs-127-0-0-1.nip.io
          secretName: victoria-logs-tls
