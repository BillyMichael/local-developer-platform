# Dashboards over VictoriaMetrics, behind Authelia. Perses is one small Go
# process with a file database; dashboards and datasources are provisioned
# from templates/provisioning.yaml, so they live in git like everything else.
ldp:
  # Needs Authelia (wave-4) for the OIDC client and VictoriaMetrics (same wave).
  syncWave: wave-6

perses:
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

  # The file database: users, and anything created in the UI.
  persistence:
    enabled: true
    size: 1Gi

  # Roll the pod when the OIDC client secret changes (StatefulSet annotations).
  annotations:
    secret.reloader.stakater.com/reload: perses-oidc-client-secret

  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: ca-issuer
    hosts:
      - host: observability-127-0-0-1.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - observability-127-0-0-1.nip.io
        secretName: perses-tls

  # The chart would otherwise copy the OIDC client secret out of values into a
  # Secret of its own and wire it in as env vars; ours is generated in-cluster
  # and mounted as a file. Naming an external Secret is what switches that
  # off (secret.create: false alone does not: the chart reads false as unset).
  # Deprecated upstream in favour of secret.name, which does not switch it off.
  secret:
    create: false
  envVarsExternalSecretName: perses-env
  # Perses falls back to a key baked into its binary when none is set. The
  # chart's schema has no encryption_key_file, so it arrives as an env var
  # (PERSES_<CONFIG_PATH>) read from the perses-env Secret, which
  # templates/encryption-key.yaml generates.
  envVars:
    - name: PERSES_SECURITY_ENCRYPTION_KEY

  config:
    security:
      enable_auth: true
      cookie:
        same_site: lax
        secure: true
      authentication:
        access_token_ttl: 1h
        refresh_token_ttl: 24h
        providers:
          enable_native: false
          oidc:
            - slug_id: authelia
              name: Authelia
              issuer: https://auth-127-0-0-1.nip.io
              client_id: perses
              # Generated by the oidc.ldp Client in templates/oidc-client.yaml.
              client_secret_file: /etc/perses/secrets/oidc/password
              redirect_uri: https://observability-127-0-0-1.nip.io/api/auth/providers/oidc/authelia/callback
              scopes: [openid, profile, email]
      authorization:
        # ponytail: everyone who can sign in may edit dashboards (one team).
        # Bind a GlobalRole to named users instead for a shared instance.
        # (The chart schema still wants the pre-provider.native spelling; Perses
        # maps it across with a deprecation warning.)
        guest_permissions:
          - actions: ["*"]
            scopes: ["*"]
    frontend:
      explorer:
        enable: true
      important_dashboards:
        - project: platform
          dashboard: cluster-overview
    database:
      file:
        folder: /perses
        extension: json
    provisioning:
      folders:
        - /etc/perses/provisioning
      # Provisioned resources overwrite the database copy on every pass, so a
      # git change shows up a minute after the ConfigMap volume refreshes.
      interval: 1m

  volumes:
    - name: oidc
      secret:
        secretName: perses-oidc-client-secret
        items:
          - key: password
            path: password
    - name: provisioning
      configMap:
        name: perses-provisioning
    # Platform CA bundle (trust-manager), so the OIDC discovery and token calls
    # to Authelia verify. Mounted over Go's default root store.
    - name: ldp-ca
      configMap:
        name: ca
  volumeMounts:
    - name: oidc
      mountPath: /etc/perses/secrets/oidc
      readOnly: true
    - name: provisioning
      mountPath: /etc/perses/provisioning
      readOnly: true
    - name: ldp-ca
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: trust-bundle.pem
      readOnly: true
