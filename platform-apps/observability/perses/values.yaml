ldp:
  syncWave: wave-6

perses:
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

  persistence:
    enabled: true
    size: 1Gi

  annotations:
    secret.reloader.stakater.com/reload: perses-oidc-client-secret

  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: ca-issuer
    hosts:
      - host: observability-127-0-0-1.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - observability-127-0-0-1.nip.io
        secretName: perses-tls

  # naming an external Secret is what stops the chart generating its own (create: false alone does not);
  # deprecated upstream in favour of secret.name, which does NOT switch it off
  secret:
    create: false
  envVarsExternalSecretName: perses-env
  # the chart schema has no encryption_key_file; value comes from perses-env (templates/encryption-key.yaml)
  envVars:
    - name: PERSES_SECURITY_ENCRYPTION_KEY

  config:
    security:
      enable_auth: true
      cookie:
        secure: true
      authentication:
        access_token_ttl: 1h
        refresh_token_ttl: 24h
        providers:
          enable_native: false
          oidc:
            - slug_id: authelia
              name: Authelia
              issuer: https://auth-127-0-0-1.nip.io
              client_id: perses
              client_secret_file: /etc/perses/secrets/oidc/password
              redirect_uri: https://observability-127-0-0-1.nip.io/api/auth/providers/oidc/authelia/callback
              scopes: [openid, profile, email]
      authorization:
        # ponytail: everyone who can sign in may edit dashboards (one team); bind a GlobalRole for a shared instance.
        guest_permissions:
          - actions: ["*"]
            scopes: ["*"]
    frontend:
      important_dashboards:
        - project: platform
          dashboard: cluster-overview
    provisioning:
      interval: 1m

  volumes:
    - name: oidc
      secret:
        secretName: perses-oidc-client-secret
        items:
          - key: password
            path: password
    - name: provisioning
      configMap:
        name: perses-provisioning
    # trust-manager bundle over Go's root store, so calls to Authelia verify
    - name: ldp-ca
      configMap:
        name: ca
  volumeMounts:
    - name: oidc
      mountPath: /etc/perses/secrets/oidc
      readOnly: true
    - name: provisioning
      mountPath: /etc/perses/provisioning
      readOnly: true
    - name: ldp-ca
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: trust-bundle.pem
      readOnly: true
