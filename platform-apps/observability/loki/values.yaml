# Pod logs for Grafana: one Loki process on local disk, one day kept.
# Alloy (next to this app) ships the logs in.
ldp:
  # Last wave with the rest of observability.
  syncWave: wave-8

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 24h
      allow_structured_metadata: true
      volume_enabled: true
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
      working_directory: /var/loki/compactor
    pattern_ingester:
      enabled: false
    ingester:
      chunk_encoding: snappy

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 384Mi

  # SimpleScalable components: all off in single-binary mode.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
