# tails node disk, not the API server (Alloy's API streaming starved etcd)
ldp:
  syncWave: wave-6

victoria-logs-collector:
  remoteWrite:
    - url: http://victoria-logs-victoria-logs-single-server.observability.svc:9428

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
