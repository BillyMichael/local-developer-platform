# Prometheus, Grafana and the exporters, trimmed to fit a laptop: one day of
# metrics, no Alertmanager, and none of the control-plane scrapes kind cannot
# serve. Loki (logs) is its own app next to this one.
ldp:
  # Last wave: the operator, Prometheus and Grafana starting together is the
  # heaviest burst in the rollout, so it runs after the portal is up rather
  # than in the middle of it. Needs Authelia (wave-4) for the Grafana client.
  syncWave: wave-8
  # The operator CRDs are too large for client-side apply.
  serverSideApply: true

kube-prometheus-stack:
  # ponytail: nothing reads alerts on a laptop. Turn Alertmanager back on
  # (and defaultRules.rules.alertmanager) when something should page.
  alertmanager:
    enabled: false

  defaultRules:
    create: true
    rules:
      alertmanager: false
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubernetesSystem: false

  # kind binds these to 127.0.0.1 inside the control-plane node, so the
  # scrapes only ever fail.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  prometheusOperator:
    admissionWebhooks:
      patch:
        # The chart's certificate Jobs delete themselves 60s after finishing.
        # Argo CD runs them as sync hooks and only proceeds once it has seen
        # them succeed; on a busy laptop VM its controller can take longer
        # than that, the Job is gone by the time it looks, and the sync waits
        # forever on a hook that no longer exists. Argo CD's hook-delete policy
        # removes them once it has recorded success; the TTL only needs to be
        # long enough never to get there first. (The chart always renders the
        # field, and 0 would mean "delete immediately".)
        ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi

  prometheus:
    prometheusSpec:
      scrapeInterval: 60s
      evaluationInterval: 60s
      retention: 1d
      retentionSize: 1GB
      # Pick up every ServiceMonitor/PodMonitor/rule on the cluster, not only
      # ones labelled for this release, so tenant charts can add their own.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 768Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 48Mi

  grafana:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    sidecar:
      resources:
        requests:
          cpu: 5m
          memory: 48Mi
        limits:
          memory: 96Mi
    podAnnotations:
      secret.reloader.stakater.com/reload: "grafana-oidc-client-secret"
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: ca-issuer
      hosts:
        - observability-127-0-0-1.nip.io
      tls:
        - hosts:
            - observability-127-0-0-1.nip.io
          secretName: grafana-tls
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.observability.svc:3100
        access: proxy
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          # Generated by the oidc.ldp Client in templates/oidc-client.yaml.
          name: grafana-oidc-client-secret
          key: password
    grafana.ini:
      server:
        root_url: https://observability-127-0-0-1.nip.io
      auth:
        disable_login_form: true
      auth.generic_oauth:
        enabled: true
        name: Authelia
        auto_login: true
        allow_sign_up: true
        client_id: grafana
        scopes: openid profile email groups
        use_pkce: true
        auth_style: InHeader
        auth_url: https://auth-127-0-0-1.nip.io/api/oidc/authorization
        token_url: https://auth-127-0-0-1.nip.io/api/oidc/token
        api_url: https://auth-127-0-0-1.nip.io/api/oidc/userinfo
        login_attribute_path: preferred_username
        groups_attribute_path: groups
        role_attribute_path: contains(groups[*], 'platform_maintainers') && 'Admin' || 'Viewer'
        # Same trade-off as Argo CD's oidc.tls.insecure.skip.verify: Authelia's
        # certificate comes from the platform's own CA.
        tls_skip_verify_insecure: true
