apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: victoria-metrics
  annotations:
    argocd/app-name: victoria-metrics
    backstage.io/kubernetes-namespace: observability
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=victoria-metrics
  description: Cluster metrics store and scraper with the Prometheus query API; vmui for ad hoc queries.
  links:
    - url: https://metrics-127-0-0-1.nip.io/vmui
      title: vmui
spec:
  type: infrastructure
  lifecycle: production
  owner: group:default/platform_maintainers
  system: developer_platform
  dependsOn:
    - component:default/traefik
    - component:default/cert-manager
