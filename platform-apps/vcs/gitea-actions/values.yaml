ldp:
  syncWave: wave-6

actions:
  enabled: true
  # register over plain HTTP; jobs use the public URL via the CA plumbing below
  giteaRootURL: http://gitea-http.vcs.svc.cluster.local:3000
  # from the gitea chart (templates/runner-token.yaml)
  existingSecret: gitea-runner-token
  existingSecretKey: token

  statefulset:
    persistence:
      size: 2Gi
    extraVolumes:
      - name: ca
        configMap:
          name: ca

    runner:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      config: |
        log:
          level: info
        runner:
          # every job container trusts the platform CA
          envs:
            SSL_CERT_FILE: /etc/ssl/certs/ldp-ca.pem
            GIT_SSL_CAINFO: /etc/ssl/certs/ldp-ca.pem
            NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ldp-ca.pem
        cache:
          enabled: false
        container:
          require_docker: true
          docker_timeout: 300s
          # paths resolve inside the dind container
          options: -v /etc/docker/certs.d/vcs-127-0-0-1.nip.io/ca.crt:/etc/ssl/certs/ldp-ca.pem:ro
          valid_volumes:
            - /etc/docker/certs.d/vcs-127-0-0-1.nip.io/ca.crt

    dind:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
      extraVolumeMounts:
        # for `docker push` to the Gitea registry, and the source of the -v mount above
        - name: ca
          mountPath: /etc/docker/certs.d/vcs-127-0-0-1.nip.io/ca.crt
          subPath: trust-bundle.pem
          readOnly: true
