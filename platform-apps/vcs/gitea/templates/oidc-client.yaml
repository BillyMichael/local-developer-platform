apiVersion: oidc.ldp/v1alpha1
kind: Client
metadata:
  name: gitea
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # A wave ahead so the client secret is complete before the pod mounts it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicateTo: {{ .Release.Namespace }}
