apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
# Namespace-scoped Role - only has permissions within vcs namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-bootstrap-role
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-bootstrap-binding
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
  - kind: ServiceAccount
    name: gitea-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: gitea-bootstrap-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: gitea-bootstrap
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              NAMESPACE="{{ .Release.Namespace }}"

              echo "Waiting for Gitea pod to be ready..."
              kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=gitea -n $NAMESPACE --timeout=300s

              # Reuse the token if the secret exists, otherwise generate one and store it
              if kubectl get secret gitea-admin-token -n $NAMESPACE >/dev/null 2>&1; then
                echo "Token secret already exists, skipping token generation"
                TOKEN=$(kubectl get secret gitea-admin-token -n $NAMESPACE -o jsonpath='{.data.token}' | base64 -d)
              else
                echo "Generating new token..."
                TOKEN=$(kubectl exec -n $NAMESPACE deploy/gitea -- /usr/local/bin/gitea admin user generate-access-token --username gitea_admin --token-name backstage-token --scopes write:repository,read:organization,write:organization,read:user,write:admin,write:user,read:issue --raw)
                [ -n "$TOKEN" ] || { echo "Failed to generate token"; exit 1; }
                echo "Creating secret in $NAMESPACE namespace with Replicator annotation..."
                cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitea-admin-token
                namespace: $NAMESPACE
                labels:
                  kargo.akuity.io/cred-type: git
                annotations:
                  replicator.v1.mittwald.de/replicate-to: "portal,orchestration"
              type: Opaque
              stringData:
                token: "$TOKEN"
                repoURL: "https://vcs-127-0-0-1.nip.io"
                repoURLIsRegex: "false"
                username: "gitea_admin"
                password: "$TOKEN"
              EOF
                echo "Secret created and will be replicated to portal."
              fi

              # ArgoCD repo-creds template so tenant apps can clone Gitea
              # repos over the in-cluster HTTP service (private repos, no TLS).
              # Replicated to orchestration where ArgoCD picks it up by label.
              if ! kubectl get secret gitea-repo-creds -n $NAMESPACE >/dev/null 2>&1; then
                echo "Creating ArgoCD repo-creds secret..."
                cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitea-repo-creds
                namespace: $NAMESPACE
                labels:
                  argocd.argoproj.io/secret-type: repo-creds
                annotations:
                  replicator.v1.mittwald.de/replicate-to: "orchestration"
              type: Opaque
              stringData:
                type: git
                url: "http://gitea-http.vcs.svc.cluster.local:3000"
                username: "gitea_admin"
                password: "$TOKEN"
              EOF
              fi

              # Create default organization if it doesn't exist
              echo "Creating default organization..."
              kubectl exec -n $NAMESPACE deploy/gitea -- wget -q -O- \
                --header="Authorization: token $TOKEN" \
                --header="Content-Type: application/json" \
                --post-data='{"username":"local-developer-platform","full_name":"Local Developer Platform","description":"Platform infrastructure and services","visibility":"public"}' \
                http://localhost:3000/api/v1/orgs 2>/dev/null || echo "Organization may already exist"

              # Registry push credential for Actions jobs: Gitea's automatic job token is not
              # accepted by its container registry. A write:package-only token, published as
              # an org Actions secret so every repo's workflow can `docker push`.
              if kubectl get secret gitea-registry-token -n $NAMESPACE >/dev/null 2>&1; then
                REGISTRY_TOKEN=$(kubectl get secret gitea-registry-token -n $NAMESPACE -o jsonpath='{.data.token}' | base64 -d)
              else
                echo "Generating registry token..."
                REGISTRY_TOKEN=$(kubectl exec -n $NAMESPACE deploy/gitea -- /usr/local/bin/gitea admin user generate-access-token --username gitea_admin --token-name actions-registry --scopes write:package --raw)
                [ -n "$REGISTRY_TOKEN" ] || { echo "Failed to generate registry token"; exit 1; }
                kubectl create secret generic gitea-registry-token -n $NAMESPACE --from-literal=token="$REGISTRY_TOKEN"
              fi
              kubectl exec -n $NAMESPACE deploy/gitea -- curl -sf -X PUT \
                -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
                -d "{\"data\":\"$REGISTRY_TOKEN\"}" \
                http://localhost:3000/api/v1/orgs/local-developer-platform/actions/secrets/REGISTRY_TOKEN

              echo "Setup complete!"
      restartPolicy: OnFailure
