ldp:
  syncWave: wave-5

gitea:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: true
    # Explicit: the chart otherwise renders ingressClassName: null, the default class fills in
    # traefik, and the app stays OutOfSync, which stalls the rollout at wave 5.
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: ca-issuer
    hosts:
      - host: vcs-127-0-0-1.nip.io
    tls:
      - secretName: gitea-server-tls
        hosts:
          - vcs-127-0-0-1.nip.io

  gitea:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      security:
        ROOT_CA: /etc/ssl/certs/ldp-ca.pem
      service:
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        ENABLE_CAPTCHA: false
        SHOW_REGISTRATION_BUTTON: false
        ENABLE_BASIC_AUTHENTICATION: false
        ENABLE_PASSWORD_SIGNIN_FORM: false
        ENABLE_PASSKEY_AUTHENTICATION: false
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        USERNAME: preferred_username
        ACCOUNT_LINKING: auto
      openid:
        ENABLE_OPENID_SIGNIN: false
        ENABLE_OPENID_SIGNUP: true
      webhook:
        # Agents (spotify-templates/agent) receive webhooks on in-cluster Services.
        ALLOWED_HOST_LIST: "external,*.svc.cluster.local"

    oauth:
      - name: "Authelia"
        provider: "openidConnect"
        key: "gitea"
        existingSecret: "gitea-oidc-client-secret"
        autoDiscoverUrl: "https://auth-127-0-0-1.nip.io/.well-known/openid-configuration"
        scopes: "openid profile email groups"

  # otherwise `gitea migrate` crash-loops into restart backoff while Postgres/Valkey start
  initPreScript: |
    timeout 600 sh -c 'until nc -z gitea-postgresql 5432; do echo waiting for gitea-postgresql:5432; sleep 5; done'
    timeout 600 sh -c 'until nc -z gitea-valkey-headless 6379; do echo waiting for gitea-valkey-headless:6379; sleep 5; done'

  valkey-cluster:
    enabled: false
  valkey:
    enabled: true

  postgresql-ha:
    enabled: false
  postgresql:
    enabled: true
    global:
      postgresql:
        auth:
          # Unused, but randomised per render otherwise, so Argo CD rewrote the secret on every sync.
          postgresPassword: gitea

  extraVolumes:
    - name: ca
      configMap:
        name: ca

  extraVolumeMounts:
    - name: ca
      mountPath: /etc/ssl/certs/ldp-ca.pem
      subPath: trust-bundle.pem
      readOnly: true

  deployment:
    env:
      - name: SSL_CERT_FILE
        value: /etc/ssl/certs/ldp-ca.pem
      - name: GITEA_RUNNER_REGISTRATION_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitea-runner-token
            key: token
