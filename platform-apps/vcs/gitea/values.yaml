ldp:
  syncWave: wave-5

gitea:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # container registry pushes and Actions logs need headroom over the old 256Mi
      memory: 512Mi
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: ca-issuer
    hosts:
      - host: vcs-127-0-0-1.nip.io
    tls:
      - secretName: gitea-server-tls
        hosts:
          - vcs-127-0-0-1.nip.io

  gitea:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      security:
        ROOT_CA: /etc/ssl/certs/ldp-ca.pem
      service:
        # No local sign-up; accounts are created on first Authelia login.
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        ENABLE_CAPTCHA: false
        SHOW_REGISTRATION_BUTTON: false
        ENABLE_BASIC_AUTHENTICATION: false
        ENABLE_PASSWORD_SIGNIN_FORM: false
        ENABLE_PASSKEY_AUTHENTICATION: false
      # Create the account on first OAuth login instead of showing Gitea's
      # "Complete Account" page, named after the LLDAP uid (the same name
      # Backstage signs in as); an existing account with the same email is
      # linked rather than duplicated.
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        USERNAME: preferred_username
        ACCOUNT_LINKING: auto
      openid:
        ENABLE_OPENID_SIGNIN: false
        ENABLE_OPENID_SIGNUP: true
      webhook:
        # Gitea blocks webhooks to private addresses by default; queue-backed agents
        # (spotify-templates/agent) receive them on in-cluster Services
        ALLOWED_HOST_LIST: "external,*.svc.cluster.local"

    oauth:
      - name: "Authelia"
        provider: "openidConnect"
        key: "gitea"
        existingSecret: "gitea-oidc-client-secret"
        autoDiscoverUrl: "https://auth-127-0-0-1.nip.io/.well-known/openid-configuration"
        scopes: "openid profile email groups"

  # Runs at the start of the first init container, before configure-gitea.
  # configure-gitea runs `gitea migrate` and exits 1 while Postgres is still
  # starting; every exit lengthens Kubernetes' restart backoff (10s, 20s, 40s,
  # 80s, 160s...), so on a cold node Gitea spent minutes in CrashLoopBackOff
  # waiting out backoffs rather than the database. Wait for the database and
  # the queue to accept connections first, so migrate runs once. Same check
  # as every other database consumer on the platform (see the chart guide).
  initPreScript: |
    wait_for() {
      i=0
      until nc -z "$1" "$2"; do
        i=$((i + 1))
        [ "$i" -ge 300 ] && { echo "gave up waiting for $1:$2"; exit 1; }
        [ $((i % 15)) -eq 1 ] && echo "waiting for $1:$2..."
        sleep 2
      done
      echo "$1:$2 is accepting connections"
    }
    wait_for gitea-postgresql 5432
    wait_for gitea-valkey-headless 6379

  valkey-cluster:
    enabled: false
  valkey:
    enabled: true

  postgresql-ha:
    enabled: false
  postgresql:
    enabled: true
    global:
      postgresql:
        auth:
          # The chart pins the gitea user's password but leaves the (unused)
          # superuser password to a random value per render, so Argo CD
          # rewrote the secret on every sync. Pin it too; nothing reads it.
          postgresPassword: gitea

  extraVolumes:
    - name: ca
      configMap:
        name: ca

  extraVolumeMounts:
    - name: ca
      mountPath: /etc/ssl/certs/ldp-ca.pem
      subPath: trust-bundle.pem
      readOnly: true

  deployment:
    env:
      - name: SSL_CERT_FILE
        value: /etc/ssl/certs/ldp-ca.pem
      # Fixed global Actions runner registration token (templates/runner-token.yaml).
      # Gitea creates it at startup; the gitea-actions chart registers with the same secret.
      - name: GITEA_RUNNER_REGISTRATION_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitea-runner-token
            key: token
