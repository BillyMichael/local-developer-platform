apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kagent
  annotations:
    argocd/app-name: kagent
    backstage.io/kubernetes-namespace: devtools
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=kagent
  description: Kubernetes-native runtime for AI agents. Agents are CRDs; no image build needed.
  tags:
    - ai
    - agents
  links:
    - url: https://agents-127-0-0-1.nip.io
      title: kagent UI
    - url: https://kagent.dev/docs
      title: kagent Documentation
spec:
  type: service
  lifecycle: production
  owner: group:default/platform_maintainers
  system: developer_platform
  dependsOn:
    - component:default/kagent-crds
    - component:default/traefik
    - component:default/cert-manager
    - component:default/kubernetes-replicator
