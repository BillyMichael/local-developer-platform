ldp:
  syncWave: wave-6

kagent:
  providers:
    default: anthropic
    anthropic:
      model: claude-sonnet-5
      # Created by cluster-up.sh from $ANTHROPIC_API_KEY; tenants get a replicated copy.
      apiKeySecretRef: kagent-anthropic
      apiKeySecretKey: ANTHROPIC_API_KEY

  # ponytail: the chart enables this by default; there is no Grafana on the platform.
  grafana-mcp:
    enabled: false

  # ponytail: kagent-tools runs as cluster-admin, shared by every tenant agent (one team per instance).

  ui:
    externalUrl: https://agents-127-0-0-1.nip.io
    route:
      enabled: false

  # Bundled demo agents: keep only the Kubernetes one (each is a Deployment).
  kgateway-agent:
    enabled: false
  istio-agent:
    enabled: false
  promql-agent:
    enabled: false
  observability-agent:
    enabled: false
  argo-rollouts-agent:
    enabled: false
  helm-agent:
    enabled: false
  cilium-policy-agent:
    enabled: false
  cilium-manager-agent:
    enabled: false
  cilium-debug-agent:
    enabled: false
