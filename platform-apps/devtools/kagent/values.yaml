ldp:
  syncWave: wave-6
  # Host names in templates/; e.g. "%s.example.com" when deploying to a real domain.
  hostPattern: "%s-127-0-0-1.nip.io"

kagent:
  providers:
    default: anthropic
    anthropic:
      model: claude-sonnet-5
      # API key: the kagent-anthropic Secret (chart default), created by cluster-up.sh from $ANTHROPIC_API_KEY
      # and replicated to tenant namespaces.

  # no Grafana on the platform
  grafana-mcp:
    enabled: false

  # ponytail: kagent-tools runs as cluster-admin, shared by every tenant agent (one team per instance).

  ui:
    externalUrl: https://agents-127-0-0-1.nip.io
    route:
      enabled: false

  # Bundled demo agents: keep only the Kubernetes one (each is a Deployment).
  kgateway-agent:
    enabled: false
  istio-agent:
    enabled: false
  promql-agent:
    enabled: false
  observability-agent:
    enabled: false
  argo-rollouts-agent:
    enabled: false
  helm-agent:
    enabled: false
  cilium-policy-agent:
    enabled: false
  cilium-manager-agent:
    enabled: false
  cilium-debug-agent:
    enabled: false
