# ponytail: no auth in front of the kagent UI (loopback only, one team). For a
# shared instance, enable the chart's oauth2-proxy against Authelia.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: ca-issuer
spec:
  tls:
    - hosts:
        - agents-127-0-0-1.nip.io
      secretName: kagent-ui-tls
  rules:
    - host: agents-127-0-0-1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kagent-ui
                port:
                  number: 8080
