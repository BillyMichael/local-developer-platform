# ponytail: no auth in front of the kagent UI (loopback only, one team). For a
# shared instance, enable the chart's oauth2-proxy against Authelia.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml .Values.ldp.ingressAnnotations | nindent 4 }}
spec:
  tls:
    - hosts:
        - {{ printf .Values.ldp.hostPattern "agents" }}
      secretName: kagent-ui-tls
  rules:
    - host: {{ printf .Values.ldp.hostPattern "agents" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kagent-ui
                port:
                  number: 8080
