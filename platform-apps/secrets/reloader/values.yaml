ldp:
  syncWave: wave-3

reloader:
  reloader:
    # Authelia hashes OIDC client secrets that later waves create; roll it when they appear.
    # Reloader ignores the ADD events from its own start-up listing, so a Reloader restart does not roll everything.
    reloadOnCreate: true
    deployment:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
