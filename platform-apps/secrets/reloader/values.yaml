ldp:
  syncWave: wave-3

reloader:
  reloader:
    # Also roll a workload when a Secret it names is *created*, not only when
    # it changes. Authelia (wave 4) hashes each OIDC client secret in an init
    # container, but Gitea, Backstage and Perses register their clients in
    # waves 5 and 6, after Authelia has started; this is what restarts it so
    # the hash is real. Reloader ignores the ADD events from its own start-up
    # listing, so a Reloader restart does not roll everything.
    reloadOnCreate: true
    deployment:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
