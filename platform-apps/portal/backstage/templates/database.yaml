# Backstage's Postgres (storage.ldp composition). CloudNativePG publishes the
# connection details as backstage-db-app; the pod's init container waits for it.
apiVersion: storage.ldp/v1alpha1
kind: PostgresDatabase
metadata:
  name: backstage-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  storageSize: 1Gi
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
