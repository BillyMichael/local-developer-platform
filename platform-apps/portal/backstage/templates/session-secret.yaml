---
# Password generator for Backstage session secret.
#
# Both resources sync a wave ahead of the Deployment so the secret is Ready
# before the first pod starts. When it arrived late, Reloader rolled the
# Deployment while the first pod was still running its database migrations;
# the two pods then raced to create the same migrations table on the fresh
# database and both wedged with "duplicate key" / "already exists".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-session-secret-generator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# ExternalSecret to generate the session secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-session-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  target:
    name: backstage-session-secret
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: backstage-session-secret-generator
