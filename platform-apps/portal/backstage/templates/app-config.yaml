apiVersion: v1
kind: ConfigMap
metadata:
  name: extra-app-config
data:
  app-config.extra.yaml: |
    app:
      title: "GlobalLogic Backstage"
      baseUrl: https://portal-127-0-0-1.nip.io

    backend:
      baseUrl: https://portal-127-0-0-1.nip.io
      listen:
        port: 7007
      cors:
        origin: https://portal-127-0-0-1.nip.io
        methods: [GET, POST, PUT, DELETE]
        credentials: true
      # Persistent catalog and search index. Plugins share the one database
      # CloudNativePG creates, a schema each, so the app user needs no
      # CREATEDB rights.
      database:
        client: pg
        pluginDivisionMode: schema
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: ${POSTGRES_DBNAME}
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: "https://auth-127-0-0-1.nip.io/.well-known/openid-configuration"
            clientId: backstage
            clientSecret: ${OIDC_CLIENT_SECRET}
            prompt: auto
            tokenEndpointAuthMethod: client_secret_post
            additionalScopes: openid profile email
    integrations:
      # token comes from the optional github-token secret; when unset the
      # config key is dropped and reads fall back to anonymous (60 req/hr)
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
      gitea:
        - host: vcs-127-0-0-1.nip.io
          username: gitea_admin
          password: ${GITEA_TOKEN}
    catalog:
      useUrlReadersSearch: true
      orphanStrategy: delete
      processingInterval: { minutes: 5 }
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      providers:
        gitea:
          ldp:
            host: vcs-127-0-0-1.nip.io
            organization: local-developer-platform
            branch: main
            catalogPath: catalog-info.yaml
            schedule:
              frequency: { minutes: 5 }
              timeout: { minutes: 3 }
        ldapOrg:
          default:
            target: ldap://lldap-chart-service.auth.svc.cluster.local:3890
            bind:
              dn: uid=svc_backstage,ou=people,dc=ldp,dc=com
              secret: ${LLDAP_BIND_PASSWORD}
            users:
              - dn: ou=people,dc=ldp,dc=com
                options:
                  # skip the admin and svc_* service accounts
                  filter: (&(objectClass=person)(!(uid=svc_*))(!(uid=admin)))
                map:
                  rdn: uid
                  name: uid
                  displayName: displayName
                  email: mail
            groups:
              - dn: ou=groups,dc=ldp,dc=com
                options:
                  # skip lldap's built-in permission groups
                  filter: (&(objectClass=groupOfUniqueNames)(!(cn=lldap_*)))
                map:
                  rdn: cn
                  name: cn
                  displayName: cn
                  members: member
            schedule:
              frequency: { minutes: 10 }
              timeout: { minutes: 3 }
      locations:
        # The System at the root and one Component per platform app. Not a
        # repo-wide **/catalog-info.yaml: that also matched the templates'
        # skeleton catalog-info.yaml files and registered unrendered
        # template placeholders as entities.
        - type: url
          target: https://github.com/BillyMichael/local-developer-platform/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/BillyMichael/local-developer-platform/blob/main/platform-apps/**/catalog-info.yaml
        - type: url
          target: https://github.com/BillyMichael/local-developer-platform/blob/main/spotify-templates/3-tier-app/template.yaml
        - type: url
          target: https://github.com/BillyMichael/local-developer-platform/blob/main/spotify-templates/agent/template.yaml
        - type: url
          target: https://github.com/BillyMichael/local-developer-platform/blob/main/spotify-templates/langgraph-agent/template.yaml
    
    # The cluster Backstage runs in, read with the pod's own service-account
    # token (read-only, see kubernetes-rbac.yaml). Entities opt in with
    # backstage.io/kubernetes-namespace + kubernetes-label-selector or -id.
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: ldp
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    # Argo CD API for the Argo CD entity cards, authenticated as the
    # read-only `backstage` account. The token is dropped (and the cards show
    # an error) until the argocd chart's token job has run.
    proxy:
      endpoints:
        '/argocd/api':
          target: http://argocd-server.orchestration.svc.cluster.local/api/v1/
          changeOrigin: true
          allowedMethods: ['GET']
          headers:
            Cookie: argocd.token=${ARGOCD_TOKEN}
    argocd:
      baseUrl: https://cd-127-0-0-1.nip.io

    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'