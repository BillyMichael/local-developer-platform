apiVersion: v1
kind: ConfigMap
metadata:
  name: extra-app-config
data:
  app-config.extra.yaml: |
    app:
      title: "GlobalLogic Backstage"
      baseUrl: https://portal-127-0-0-1.nip.io

    backend:
      baseUrl: https://portal-127-0-0-1.nip.io
      listen:
        port: 7007
      cors:
        origin: https://portal-127-0-0-1.nip.io
        methods: [GET, POST, PUT, DELETE]
        credentials: true
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: "https://auth-127-0-0-1.nip.io/.well-known/openid-configuration"
            clientId: backstage
            clientSecret: ${OIDC_CLIENT_SECRET}
            prompt: auto
            tokenEndpointAuthMethod: client_secret_post
            additionalScopes: openid profile email
    integrations:
      gitea:
        - host: vcs-127-0-0-1.nip.io
          username: gitea_admin
          password: ${GITEA_TOKEN}
    catalog:
      useUrlReadersSearch: true
      orphanStrategy: delete
      processingInterval: { minutes: 5 }
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      providers:
        gitea:
          ldp:
            host: vcs-127-0-0-1.nip.io
            organization: local-developer-platform
            branch: main
            catalogPath: catalog-info.yaml
            schedule:
              frequency: { minutes: 5 }
              timeout: { minutes: 3 }
        ldapOrg:
          default:
            target: ldap://lldap-chart-service.auth.svc.cluster.local:3890
            bind:
              dn: uid=svc_backstage,ou=people,dc=ldp,dc=com
              secret: ${LLDAP_BIND_PASSWORD}
            users:
              - dn: ou=people,dc=ldp,dc=com
                options:
                  # skip the admin and svc_* service accounts
                  filter: (&(objectClass=person)(!(uid=svc_*))(!(uid=admin)))
                map:
                  rdn: uid
                  name: uid
                  displayName: displayName
                  email: mail
            groups:
              - dn: ou=groups,dc=ldp,dc=com
                options:
                  # skip lldap's built-in permission groups
                  filter: (&(objectClass=groupOfUniqueNames)(!(cn=lldap_*)))
                map:
                  rdn: cn
                  name: cn
                  displayName: cn
                  members: member
            schedule:
              frequency: { minutes: 10 }
              timeout: { minutes: 3 }
      locations:
        - type: url
          target: https://github.com/BillyMichael/local-developer-platform/blob/main/**/catalog-info.yaml
        - type: url
          target: https://github.com/BillyMichael/local-developer-platform/blob/main/spotify-templates/3-tier-app/template.yaml
    
    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'