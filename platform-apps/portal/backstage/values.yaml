ldp:
  syncWave: wave-6

backstage:
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: ca-issuer
    host: portal-127-0-0-1.nip.io
    tls:
      enabled: true
      secretName: backstage-tls
  serviceAccount:
    create: true
    name: backstage
  backstage:
    # The chart's args replace the image's command, which loaded the
    # app-config.yaml baked into the image (permissions, app.extensions).
    # Load it first; the chart appends app-config.extra.yaml after it.
    args:
      - --config
      - app-config.yaml
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    podAnnotations:
      reloader.stakater.com/auto: "true"
    # Wait for the database before the backend starts. Backstage exits when it
    # cannot connect, and each exit lengthens the restart backoff; a wait here
    # means the image pulls while Postgres comes up and the backend runs once.
    initContainers:
      - name: wait-for-db
        image: busybox:1.37-musl
        command:
          - sh
          - -c
          - |
            i=0
            until nc -z backstage-db-rw 5432; do
              i=$((i + 1))
              [ "$i" -ge 300 ] && { echo "gave up waiting for backstage-db-rw:5432"; exit 1; }
              [ $((i % 15)) -eq 1 ] && echo "waiting for backstage-db-rw:5432..."
              sleep 2
            done
            echo "database is accepting connections"
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
    # The chart's defaults give the backend 30s to open its port (3 x 10s, 1s
    # timeout) and kill it after three slow health answers. On a laptop VM a
    # cold start under load takes longer than that, and a burst elsewhere
    # (a heavy wave rolling out) makes a healthy backend answer slowly: the
    # kubelet then terminates a working Backstage mid-startup, over and over.
    # Five minutes to start, and five-second answers tolerated while running.
    startupProbe:
      httpGet:
        path: /.backstage/health/v1/liveness
        port: 7007
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /.backstage/health/v1/liveness
        port: 7007
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /.backstage/health/v1/readiness
        port: 7007
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 5
    # One pod at a time, always. Backstage runs its plugins' database
    # migrations on startup, and two pods starting together against a fresh
    # database race on the migrations table and both wedge. The default
    # RollingUpdate surges a second pod whenever Reloader or a config change
    # rolls the Deployment, which on a slow VM overlaps the first pod's start.
    strategy:
      type: Recreate
    image:
      registry: ghcr.io
      repository: billymichael/local-developer-platform
      tag: latest
    extraAppConfig:
    - filename: app-config.extra.yaml
      configMapRef: extra-app-config
    extraEnvVars:
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: backstage-oidc-client-secret
            key: password
      - name: AUTH_SESSION_SECRET
        valueFrom:
          secretKeyRef:
            name: backstage-session-secret
            key: password
      - name: GITEA_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitea-admin-token
            key: token
      - name: LLDAP_BIND_PASSWORD
        valueFrom:
          secretKeyRef:
            name: lldap-backstage-credentials
            key: password
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-token
            key: token
            optional: true
      # connection details published by CloudNativePG (templates/database.yaml)
      - name: POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: host
      - name: POSTGRES_PORT
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: port
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: user
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: password
      - name: POSTGRES_DBNAME
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: dbname
      # minted by the argocd chart's backstage-token job
      - name: ARGOCD_TOKEN
        valueFrom:
          secretKeyRef:
            name: argocd-backstage-token
            key: token
            optional: true
      - name: NODE_EXTRA_CA_CERTS
        value: /etc/ssl/certs/ldp-ca.pem

    extraVolumes:
      - name: ca
        configMap:
          name: ca

    extraVolumeMounts:
      - name: ca
        mountPath: /etc/ssl/certs/ldp-ca.pem
        subPath: trust-bundle.pem
        readOnly: true
