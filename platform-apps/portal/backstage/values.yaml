ldp:
  syncWave: wave-6

backstage:
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: ca-issuer
    host: portal-127-0-0-1.nip.io
    tls:
      enabled: true
      secretName: backstage-tls
  serviceAccount:
    create: true
    name: backstage
  backstage:
    # The chart's default allows 30s (3 x 10s) to boot; first start on
    # Postgres runs every plugin's migrations and takes longer, so the probe
    # killed the pod mid-start. Allow up to 5 minutes.
    startupProbe:
      httpGet:
        path: /.backstage/health/v1/liveness
        port: 7007
        scheme: HTTP
      periodSeconds: 10
      failureThreshold: 30
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    podAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      registry: ghcr.io
      repository: billymichael/local-developer-platform
      tag: latest
    extraAppConfig:
    - filename: app-config.extra.yaml
      configMapRef: extra-app-config
    extraEnvVars:
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: backstage-oidc-client-secret
            key: password
      - name: AUTH_SESSION_SECRET
        valueFrom:
          secretKeyRef:
            name: backstage-session-secret
            key: password
      - name: GITEA_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitea-admin-token
            key: token
      - name: LLDAP_BIND_PASSWORD
        valueFrom:
          secretKeyRef:
            name: lldap-backstage-credentials
            key: password
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-token
            key: token
            optional: true
      # connection details published by CloudNativePG (templates/database.yaml)
      - name: POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: host
      - name: POSTGRES_PORT
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: port
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: user
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: password
      - name: POSTGRES_DBNAME
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: dbname
      # minted by the argocd chart's backstage-token job
      - name: ARGOCD_TOKEN
        valueFrom:
          secretKeyRef:
            name: argocd-backstage-token
            key: token
            optional: true
      - name: NODE_EXTRA_CA_CERTS
        value: /etc/ssl/certs/ldp-ca.pem

    extraVolumes:
      - name: ca
        configMap:
          name: ca

    extraVolumeMounts:
      - name: ca
        mountPath: /etc/ssl/certs/ldp-ca.pem
        subPath: trust-bundle.pem
        readOnly: true
