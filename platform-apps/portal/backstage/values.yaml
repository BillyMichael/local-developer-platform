ldp:
  syncWave: wave-6

backstage:
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: ca-issuer
    host: portal-127-0-0-1.nip.io
    tls:
      enabled: true
      secretName: backstage-tls
  serviceAccount:
    create: true
    name: backstage
  backstage:
    # The image's baked-in app-config.yaml must load before the chart's extra config.
    args:
      - --config
      - app-config.yaml
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    podAnnotations:
      reloader.stakater.com/auto: "true"
    # pull-image first so the ~3 min pull overlaps DB start-up; wait-for-db avoids crash-loop backoff
    initContainers:
      - name: pull-image
        image: '{{ include "backstage.image" . }}'
        command: ["node", "--version"]
      - name: wait-for-db
        image: busybox:1.37-musl
        command: ["timeout", "600", "sh", "-c", "until nc -z backstage-db-rw 5432; do echo waiting for backstage-db-rw:5432; sleep 5; done"]
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
    # chart defaults (30s to start, 1s timeout) kill the backend on a busy laptop VM
    startupProbe:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    livenessProbe:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      periodSeconds: 10
      timeoutSeconds: 5
    # Two pods migrating the same fresh database wedge each other.
    strategy:
      type: Recreate
    image:
      repository: billymichael/local-developer-platform
      tag: latest
    extraAppConfig:
    - filename: app-config.extra.yaml
      configMapRef: extra-app-config
    extraEnvVars:
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: backstage-oidc-client-secret
            key: password
      - name: AUTH_SESSION_SECRET
        valueFrom:
          secretKeyRef:
            name: backstage-session-secret
            key: password
      - name: GITEA_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitea-admin-token
            key: token
      - name: LLDAP_BIND_PASSWORD
        valueFrom:
          secretKeyRef:
            name: lldap-backstage-credentials
            key: password
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-token
            key: token
            optional: true
      # connection details published by CloudNativePG (templates/database.yaml)
      - name: POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: host
      - name: POSTGRES_PORT
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: port
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: user
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: password
      - name: POSTGRES_DBNAME
        valueFrom:
          secretKeyRef:
            name: backstage-db-app
            key: dbname
      # minted by the argocd chart's backstage-token job
      - name: ARGOCD_TOKEN
        valueFrom:
          secretKeyRef:
            name: argocd-backstage-token
            key: token
            optional: true
      - name: NODE_EXTRA_CA_CERTS
        value: /etc/ssl/certs/ldp-ca.pem

    extraVolumes:
      - name: ca
        configMap:
          name: ca

    extraVolumeMounts:
      - name: ca
        mountPath: /etc/ssl/certs/ldp-ca.pem
        subPath: trust-bundle.pem
        readOnly: true
