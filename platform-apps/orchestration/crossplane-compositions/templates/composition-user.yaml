# Crossplane v2 composes the External Secrets resources directly. The resources
# live in files/user.yaml.gotmpl, rendered by function-go-templating; keeping
# them out of templates/ means Helm never parses their template expressions.
# Crossplane's permission to manage them comes from rbac.yaml.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: user.oidc.ldp
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '-1'
spec:
  compositeTypeRef:
    apiVersion: oidc.ldp/v1alpha1
    kind: User
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
{{ .Files.Get "files/user.yaml.gotmpl" | indent 12 }}
