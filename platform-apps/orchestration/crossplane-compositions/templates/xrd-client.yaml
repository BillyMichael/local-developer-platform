# Cluster-scoped so the composition can place the generated secret in the auth
# namespace (where Authelia reads it) and replicate it out to the consumer. A
# namespaced XR can only compose into its own namespace. No claims: in
# Crossplane v2 platform charts create the Client directly.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: clients.oidc.ldp
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '-1'
spec:
  scope: Cluster
  group: oidc.ldp
  names:
    kind: Client
    plural: clients
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicateTo:
                  type: string
                  description: Namespace the client secret is replicated to (the consuming app's namespace)
                sourceNamespace:
                  type: string
                  description: Namespace where the secret is created
                  default: auth
                secretLength:
                  type: integer
                  description: Length of the generated client secret
                  default: 72
                digits:
                  type: integer
                  default: 10
                symbols:
                  type: integer
                  default: 5
                symbolCharacters:
                  type: string
                  default: "-_~."
              required:
                - replicateTo
