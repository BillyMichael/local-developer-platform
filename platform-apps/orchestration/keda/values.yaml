ldp:
  syncWave: wave-4
  # KEDA's CRDs exceed the 256KiB last-applied-configuration annotation limit
  serverSideApply: true

keda:
  resources:
    operator:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
    metricServer:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
    webhooks:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
