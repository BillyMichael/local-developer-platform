ldp:
  syncWave: wave-5

kargo:
  # grants the controller read access to the git credential gitea's bootstrap job replicates here
  global:
    sharedResources:
      namespace: orchestration
      createNamespace: false
  webhooksServer:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  api:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    podAnnotations:
      reloader.stakater.com/auto: "true"
    tls:
      enabled: false
    cabundle:
      configMapName: ca
    oidc:
      enabled: true
      issuerURL: https://auth-127-0-0-1.nip.io
      clientID: kargo
      admins:
        claims:
          groups:
          - platform_maintainers
      usernameClaim: sub
    host: kargo-127-0-0-1.nip.io
    adminAccount: 
      enabled: false
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: ca-issuer
      tls:
        selfSignedCert: false 
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    cabundle:
      configMapName: ca
    argocd:
      namespace: orchestration