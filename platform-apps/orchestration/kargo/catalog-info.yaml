apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kargo
  annotations:
    argocd/app-name: kargo
    backstage.io/kubernetes-namespace: orchestration
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=kargo
  description: A new way to do continuous delivery.
spec:
  type: website
  lifecycle: production
  owner: group:default/platform_maintainers
  system: developer_platform
  dependsOn:
    - component:default/traefik
    - component:default/cert-manager
    - component:default/argocd
