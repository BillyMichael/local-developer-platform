ldp:
  syncWave: wave-1

crossplane:
  # the package manager pulls xpkgs itself, not via containerd, so it needs the proxy CA too
  registryCaBundleConfig:
    name: ldp-ca-bundle
    key: ca-certificates.crt
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
