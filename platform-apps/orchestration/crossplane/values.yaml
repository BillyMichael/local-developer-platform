ldp:
  syncWave: wave-1

crossplane:
  # Package manager pulls xpkg images itself rather than through containerd, so
  # it needs the proxy CA too. ldp-ca-bundle is published into this
  # namespace by cluster-up.sh before Argo CD starts.
  registryCaBundleConfig:
    name: ldp-ca-bundle
    key: ca-certificates.crt
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
