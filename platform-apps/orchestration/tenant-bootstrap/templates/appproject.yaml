apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ required "tenant.name is required" .Values.tenant.name }}
  namespace: orchestration
spec:
  description: "Tenant project for {{ .Values.tenant.name }}"
  sourceRepos:
    - {{ required "tenant.repoURL is required" .Values.tenant.repoURL | quote }}
  destinations:
    - namespace: {{ .Values.tenant.name }}
      server: https://kubernetes.default.svc
  # only for CreateNamespace=true
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # no RBAC, so a tenant repo cannot grant itself more
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: "*"
  orphanedResources:
    warn: true
