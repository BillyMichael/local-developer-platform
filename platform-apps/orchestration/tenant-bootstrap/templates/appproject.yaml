apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ required "tenant.name is required" .Values.tenant.name }}
  namespace: orchestration
spec:
  description: "Tenant project for {{ .Values.tenant.name }}"
  sourceRepos:
    - {{ required "tenant.repoURL is required" .Values.tenant.repoURL | quote }}
  destinations:
    - namespace: {{ .Values.tenant.name }}
      server: https://kubernetes.default.svc
  # CreateNamespace=true on the tenant app needs to create the (cluster-scoped)
  # Namespace; permit nothing else at cluster scope
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Tenants are pinned to their own namespace by destinations above; within it,
  # allow everything except RBAC so a tenant repo cannot grant itself more
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: "*"
  orphanedResources:
    warn: true
