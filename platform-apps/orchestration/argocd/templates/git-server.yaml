{{- if .Values.platform.gitServer.enabled }}
# In-cluster, read-only git remote for this checkout.
#
# cluster-up.sh bind-mounts the checkout's .git directory into every kind node
# at platform.gitServer.hostPath (see cluster-config.yaml). This Deployment
# serves it over git smart HTTP so the platform ApplicationSets read the
# committed HEAD of the local checkout instead of a remote on GitHub: a commit
# here reaches the cluster within the generator's requeue interval, no push,
# no internet, and nobody else's pushes change a running platform.
#
# alpine/k8s carries git and python3 but not git-http-backend, so
# files/git-serve.py implements the fetch half of the protocol over
# `git upload-pack`. Pushes are refused.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldp-git-server
  namespace: {{ .Release.Namespace }}
data:
  git-serve.py: |
{{ .Files.Get "files/git-serve.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldp-git
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ldp-git
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ldp-git
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ldp-git
    spec:
      containers:
        - name: git
          image: {{ .Values.platform.gitServer.image }}
          command: ["python3", "/opt/ldp/git-serve.py"]
          env:
            - name: GIT_ROOT
              value: /repos
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: checkout
              mountPath: /repos/{{ .Values.platform.gitServer.repoName }}
              readOnly: true
            - name: server
              mountPath: /opt/ldp
              readOnly: true
      volumes:
        - name: checkout
          hostPath:
            path: {{ .Values.platform.gitServer.hostPath }}
            # Fails the pod loudly when the node lacks the bind mount (cluster
            # created from an older cluster-config.yaml, or the engine's VM does
            # not share the checkout's directory).
            type: Directory
        - name: server
          configMap:
            name: ldp-git-server
---
apiVersion: v1
kind: Service
metadata:
  name: ldp-git
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: ldp-git
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
