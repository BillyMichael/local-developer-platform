{{- if .Values.platform.applicationSets.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps
  annotations:
    # keeps the appset out of the argocd app's aggregate health (see health.lua in values)
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        {{- range $i := until (int .Values.platform.syncWaves) }}
        - matchExpressions:
            - key: ldp.dev/sync-wave
              operator: In
              values:
                - wave-{{ add1 $i }}
        {{- end }}
  generators:
    - git:
        repoURL: {{ .Values.platform.repoURL }}
        revision: {{ .Values.platform.targetRevision }}
        files:
          - path: "platform-apps/**/values.yaml"
        requeueAfterSeconds: 10
  template:
    metadata:
      name: '{{ `{{ index .path.segments 2 }}` }}'
      labels:
        ldp.dev/sync-wave: '{{ `{{ dig "ldp" "syncWave" "wave-` }}{{ .Values.platform.syncWaves }}{{ `" . }}` }}'
    spec:
      project: default
      source:
        repoURL: {{ .Values.platform.repoURL }}
        targetRevision: {{ .Values.platform.targetRevision }}
        path: '{{ `{{ .path.path }}` }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ `{{ index .path.segments 1 }}` }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - 'ServerSideApply={{ `{{ dig "ldp" "serverSideApply" false . }}` }}'
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
{{- end }}
