ldp:
  syncWave: wave-3
  # Argo CD 3.3+ ApplicationSet CRD exceeds the client-side-apply annotation limit
  serverSideApply: true

platform:
  # In-cluster remote for this checkout (templates/git-server.yaml); point at a real remote to track a shared repo.
  repoURL: http://ldp-git.orchestration.svc.cluster.local/ldp.git
  targetRevision: HEAD
  gitServer:
    enabled: true
    image: alpine/k8s:1.34.11
    hostPath: /ldp/repo.git   # where cluster-up.sh mounts the checkout's .git on every node
    repoName: ldp.git
  # Rolling-sync steps; apps without ldp.syncWave default to the last one.
  syncWaves: 6
  applicationSets:
    enabled: true
  claims:
    enabled: true

argo-cd:
  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    podAnnotations:
      secret.reloader.stakater.com/reload: "argocd-oidc-client-secret"
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: ca-issuer
      tls: true

  global:
    domain: cd-127-0-0-1.nip.io
    # kindnet does not enforce NetworkPolicy
    networkPolicy:
      create: false

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
  # ldp-ca-bundle (from cluster-up.sh) adds any TLS-inspecting proxy CA
  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 768Mi
    volumes:
      - name: ldp-ca-bundle
        configMap:
          name: ldp-ca-bundle
    volumeMounts:
      - name: ldp-ca-bundle
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt
        readOnly: true
  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    extraVolumes:
      - name: ldp-ca-bundle
        configMap:
          name: ldp-ca-bundle
    extraVolumeMounts:
      - name: ldp-ca-bundle
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt
        readOnly: true

  dex:
    enabled: false
  configs:
    params:
      server.insecure: 'true'
      applicationsetcontroller.enable.progressive.syncs: 'true'
    cm:
      oidc.tls.insecure.skip.verify: 'true'
      # The 3.x default, but explicit: an older bootstrap Argo CD would label-track the early
      # waves, and 3.x then sees the leftover instance label as drift.
      application.resourceTrackingMethod: annotation
      # Crossplane Argo CD guide: one per managed resource, never read
      resource.exclusions: |
        - apiGroups: ["*"]
          kinds: ["ProviderConfigUsage"]
          clusters: ["*"]
      accounts.backstage: apiKey
      resource.customizations: |
        # 3.x keeps an appset Progressing during RollingSync; it rolls out argocd itself, so that deadlocks
        argoproj.io/ApplicationSet:
          health.lua: |
            hs = { status = "Healthy", message = "Rollout progress is tracked by the Applications, not here." }
            if obj.status ~= nil and obj.status.conditions ~= nil then
              for _, c in ipairs(obj.status.conditions) do
                if c.type == "ErrorOccurred" and c.status == "True" then
                  hs.status = "Degraded"
                  hs.message = c.message
                end
              end
            end
            return hs
        "*.crossplane.io/*": &crossplane-health
          health.lua: |
            local healthy = { Ready = true, Healthy = true, Offered = true, Established = true, ValidPipeline = true, RevisionHealthy = true }
            if obj.status == nil or next(obj.status) == nil and (obj.kind == "Composition" or obj.kind == "CompositionRevision") then
              return { status = "Healthy", message = "Resource is up-to-date." }
            end
            hs = { status = "Progressing", message = "Provisioning ..." }
            if next(obj.status) == nil or obj.status.conditions == nil then
              return hs
            end
            for _, c in ipairs(obj.status.conditions) do
              if (c.type == "LastAsyncOperation" or c.type == "Synced") and c.status == "False" then
                return { status = "Degraded", message = c.message }
              end
              if healthy[c.type] and c.status == "True" then
                hs = { status = "Healthy", message = "Resource is up-to-date." }
              end
            end
            return hs
        # own XRD groups: without a check a claim counts as healthy the moment it exists
        "*.ldp/*": *crossplane-health
        networking.k8s.io/Ingress:
          health.lua: |
            return { status = "Healthy" }
      oidc.config: |
        name: 'Authelia'
        issuer: 'https://auth-127-0-0-1.nip.io'
        clientID: 'argocd'
        clientSecret: $argocd-oidc-client-secret:password
        cliClientID: 'argocd-cli'
        requestedScopes:
          - 'openid'
          - 'email'
          - 'groups'
        enableUserInfoGroups: true
        userInfoPath: '/api/oidc/userinfo'
    rbac:
      policy.default: 'role:readonly'
      policy.csv: |
        g, platform_maintainers, role:admin
        g, backstage, role:readonly
       