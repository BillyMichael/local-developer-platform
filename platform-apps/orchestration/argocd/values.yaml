ldp:
  syncWave: wave-3
  # Argo CD 3.3+ ApplicationSet CRD exceeds the client-side-apply annotation limit
  serverSideApply: true

platform:
  # The in-cluster remote for this checkout (templates/git-server.yaml); HEAD is
  # whatever branch is checked out. Point at a real remote to track a shared repo.
  repoURL: http://ldp-git.orchestration.svc.cluster.local/ldp.git
  targetRevision: HEAD
  gitServer:
    enabled: true
    image: alpine/k8s:1.34.11
    hostPath: /ldp/repo.git   # where cluster-up.sh mounts the checkout's .git on every node
    repoName: ldp.git
  # Rolling-sync steps; apps without ldp.syncWave default to the last one.
  syncWaves: 6
  applicationSets:
    enabled: true
  claims:
    enabled: true

argo-cd:
  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    podAnnotations:
      secret.reloader.stakater.com/reload: "argocd-oidc-client-secret"
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: ca-issuer
      hostname: cd-127-0-0-1.nip.io
      tls: true

  global:
    domain: cd-127-0-0-1.nip.io
    # chart 10 defaults this to true; kindnet does not enforce NetworkPolicy, keep the install minimal
    networkPolicy:
      create: false

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
  # ldp-ca-bundle (published by cluster-up.sh) carries any TLS-inspecting proxy
  # CA; mounted over the system bundle so git and helm fetches verify.
  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 768Mi
    volumes:
      - name: ldp-ca-bundle
        configMap:
          name: ldp-ca-bundle
    volumeMounts:
      - name: ldp-ca-bundle
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt
        readOnly: true
  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    extraVolumes:
      - name: ldp-ca-bundle
        configMap:
          name: ldp-ca-bundle
    extraVolumeMounts:
      - name: ldp-ca-bundle
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt
        readOnly: true

  dex:
    enabled: false
  configs:
    params:
      server.insecure: 'true'
      applicationsetcontroller.enable.progressive.syncs: 'true'
    cm:
      url: https://cd-127-0-0-1.nip.io
      create: true
      oidc.tls.insecure.skip.verify: 'true'
      application.resourceTrackingMethod: annotation
      # Per the Crossplane Argo CD guide: one per managed resource, never read.
      resource.exclusions: |
        - apiGroups: ["*"]
          kinds: ["ProviderConfigUsage"]
          clusters: ["*"]
      # Read-only account for Backstage; token minted by templates/job-backstage-token.yaml.
      accounts.backstage: apiKey
      resource.customizations: |
        # Argo CD 3.x reports an ApplicationSet as Progressing for as long as its
        # RollingSync runs. This chart's PostSync hooks make the sync wait for
        # wave-0 health first, and the platform ApplicationSet rolls out the
        # argocd Application itself, so the two waited on each other for ever on
        # a fresh cluster. Its rollout is not this resource's health.
        argoproj.io/ApplicationSet:
          health.lua: |
            hs = { status = "Healthy", message = "Rollout progress is tracked by the Applications, not here." }
            if obj.status ~= nil and obj.status.conditions ~= nil then
              for _, c in ipairs(obj.status.conditions) do
                if c.type == "ErrorOccurred" and c.status == "True" then
                  hs.status = "Degraded"
                  hs.message = c.message
                end
              end
            end
            return hs
        "*.crossplane.io/*": &crossplane-health
          health.lua: |
            health_status = {
              status = "Progressing",
              message = "Provisioning ..."
            }

            local function contains (table, val)
              for i, v in ipairs(table) do
                if v == val then
                  return true
                end
              end
              return false
            end

            local has_no_status = {
              "Composition",
              "CompositionRevision"
            }
            if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
                health_status.status = "Healthy"
                health_status.message = "Resource is up-to-date."
              return health_status
            end

            if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
              return health_status
            end

            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "LastAsyncOperation" then
                if condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end
              end

              if condition.type == "Synced" then
                if condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end
              end

              if contains({"Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy"}, condition.type) then
                if condition.status == "True" then
                  health_status.status = "Healthy"
                  health_status.message = "Resource is up-to-date."
                end
              end
            end

            return health_status
        # The platform's own XRD groups (oidc.ldp, storage.ldp): Argo CD matches
        # health checks by API group, so the crossplane.io entry does not cover
        # them and an unassessed claim counts as healthy the moment it exists.
        "*.ldp/*": *crossplane-health
        networking.k8s.io/Ingress:
          health.lua: |
            hs = {}
            hs.status = "Healthy"
            return hs
      oidc.config: |
        name: 'Authelia'
        issuer: 'https://auth-127-0-0-1.nip.io'
        clientID: 'argocd'
        clientSecret: $argocd-oidc-client-secret:password
        cliClientID: 'argocd-cli'
        requestedScopes:
          - 'openid'
          - 'email'
          - 'groups'
        enableUserInfoGroups: true
        userInfoPath: '/api/oidc/userinfo'
    rbac:
      policy.default: 'role:readonly'
      policy.csv: |
        g, platform_maintainers, role:admin
        g, backstage, role:readonly
       