# The chart would randAlphaNum these on every render (Argo CD runs no lookup), so the app never synced.
# The storage key only guards the SQLite file on the pod's emptyDir, so a fresh pod and a fresh key go together.
{{- $keys := list "session.encryption.key" "storage.encryption.key" "identity_validation.reset_password.jwt.hmac.key" "identity_providers.oidc.hmac.key" }}
{{- range $keys }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authelia-{{ . | replace "." "-" | replace "_" "-" }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-generated
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  refreshPolicy: CreatedOnce
  target:
    name: authelia-generated
  dataFrom:
  {{- range $keys }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authelia-{{ . | replace "." "-" | replace "_" "-" }}
      rewrite:
        - regexp:
            source: "^password$"
            target: {{ . | quote }}
  {{- end }}
