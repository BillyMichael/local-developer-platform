kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# config_path: cluster-up.sh drops per-registry hosts.toml files. __LDP_GIT_DIR__ is rendered by cluster-up.sh.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: KubeletConfiguration
        serializeImagePulls: false
        maxParallelImagePulls: 10
    extraPortMappings:
      - containerPort: 30080   # Traefik NodePort (HTTP)
        hostPort: 80
        protocol: TCP
      - containerPort: 30443   # Traefik NodePort (HTTPS)
        hostPort: 443
        protocol: TCP
    extraMounts:
      - hostPath: __LDP_GIT_DIR__
        containerPath: /ldp/repo.git
        readOnly: true
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        serializeImagePulls: false
        maxParallelImagePulls: 10
    extraMounts:
      - hostPath: __LDP_GIT_DIR__
        containerPath: /ldp/repo.git
        readOnly: true

