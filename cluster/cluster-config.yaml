kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Per-registry hosts.toml files (CA trust for the in-cluster Gitea registry) are
# written here by cluster-up.sh; containerd only honours them when config_path is set.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: KubeletConfiguration
        serializeImagePulls: false
        maxParallelImagePulls: 10
    extraPortMappings:
      - containerPort: 30080   # Traefik NodePort (HTTP)
        hostPort: 80
        protocol: TCP
      - containerPort: 30443   # Traefik NodePort (HTTPS)
        hostPort: 443
        protocol: TCP
      - containerPort: 30900   # Traefik NodePort (dashboard/API)
        hostPort: 9000
        protocol: TCP
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        serializeImagePulls: false
        maxParallelImagePulls: 10
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        serializeImagePulls: false
        maxParallelImagePulls: 10

